#
# hyprlock v0.9.6
#
# NOTE: hyprlock is a SEPARATE app and still uses hyprlang (.conf).
# Only Hyprland itself moved to Lua — do not "convert" this file.
#
# Same family as the rest of the shell: the wallpaper, blurred and dimmed;
# one translucent glass field (the .Dropdown recipe: surface @ ~0.55 with a
# faint light rim); the clock treated like the bar's — large time, small
# dim am/pm. Colours come from hyprlock-colors.conf, regenerated by matugen
# from the current wallpaper.
#
source = ~/.config/hypr/hyprlock-colors.conf

# NOTE: `grace` is NOT a config option in hyprlock 0.9.6 — it is the
# CLI flag `--grace <seconds>`. Putting it here makes hyprlock print
# "config option <general:grace> does not exist" and ignore it.
#
# It is deliberately NOT passed anywhere (2026-09-01). During the grace
# window hyprlock unlocks on ANY input with no password, so a trackpad
# brush after SUPER+L, or a lid-open landing in the window after
# before_sleep_cmd, silently defeated the lock.
general {
    hide_cursor = true
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = easeOut, 0.25, 1, 0.5, 1
    animation = fadeIn, 1, 4, easeOut
    animation = fadeOut, 1, 4, easeOut
}

background {
    monitor =
    # Written by scripts/wallpaper.sh --set lockscreen <file> (the AGS
    # switcher's "lockscreen" target). Always a JPEG, because the
    # collection mixes png/webp/mp4 and this is one fixed path.
    # Falls back to a screenshot blur if the file isn't there yet.
    path = ~/.config/wallpapers/lockscreen/current.jpg
    blur_passes = 3
    blur_size = 8
    noise = 0.012
    contrast = 1.0
    brightness = 0.5
    vibrancy = 0.17
}

# clock — big time, small dim am/pm (the bar's own treatment). Pango
# markup: `alpha` dims the suffix without needing a palette hex.
label {
    monitor =
    text = cmd[update:1000] date +"<span font_size='88pt'>%-I:%M</span><span font_size='22pt' alpha='55%'> %P</span>"
    color = $fg
    font_family = JetBrainsMono Nerd Font ExtraBold
    position = 0, 210
    halign = center
    valign = center
}

# date
label {
    monitor =
    text = cmd[update:60000] date +"%A, %-d %B"
    color = $muted
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 0, 122
    halign = center
    valign = center
}

# weather, beside the date — read from the shell's cached forecast (no network, no place
# name; a lock screen is public). Empty when weather is not set up.
label {
    monitor =
    text = cmd[update:120000] ~/.config/hypr/scripts/lock-weather.py
    color = $muted
    font_size = 13
    font_family = JetBrainsMono Nerd Font
    position = 0, 92
    halign = center
    valign = center
}

# now playing, only while something is actually playing
label {
    monitor =
    text = cmd[update:4000] ~/.config/hypr/scripts/lock-nowplaying.sh
    color = $muted
    font_size = 13
    font_family = JetBrainsMono Nerd Font
    position = 0, -84
    halign = center
    valign = center
}

# input — the glass pill. Translucent fill + light rim, no accent outline
# at rest; the accent appears only while checking, the error colour only
# on a wrong password.
input-field {
    monitor =
    size = 340, 56
    outline_thickness = 1
    dots_size = 0.26
    dots_spacing = 0.35
    dots_center = true
    dots_rounding = -1

    outer_color = $rim
    inner_color = $glass
    font_color = $fg
    font_family = JetBrainsMono Nerd Font
    check_color = $accent
    fail_color = $error
    capslock_color = $warn

    fade_on_empty = false
    rounding = -1
    shadow_passes = 0

    placeholder_text = <span foreground="##$muted_hex">Password</span>
    fail_text = <span foreground="##$error_hex">$FAIL</span>

    position = 0, 20
    halign = center
    valign = center
}

# who is locked out, under the field
label {
    monitor =
    text =   $USER
    color = $muted
    font_size = 13
    font_family = JetBrainsMono Nerd Font
    position = 0, -44
    halign = center
    valign = center
}

# battery, bottom left
label {
    monitor =
    text = cmd[update:30000] printf "  %s%%" "$(cat /sys/class/power_supply/BAT*/capacity 2>/dev/null | head -1)"
    color = $muted
    font_size = 13
    font_family = JetBrainsMono Nerd Font
    position = 30, 30
    halign = left
    valign = bottom
}
