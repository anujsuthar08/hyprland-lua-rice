#
# hypridle v0.1.8 — hyprlang (.conf), not Lua.
#
# Ladder: dim -> lock -> screen off -> suspend.
# `lock_cmd` is guarded with pidof so a second trigger can't stack up
# multiple hyprlock instances on top of each other.
#
# ⚠️ `hyprctl dispatch dpms on/off` is the OLD hyprlang dispatcher
# syntax — under this Lua config, `hyprctl dispatch` wraps its argument
# as `hl.dispatch(...)` and evaluates it as LUA (see CLAUDE.md). Bare
# `dpms on` is not valid Lua and throws a hard parse error every time,
# confirmed live: `[string "return hl.dispatch(dpms off)"]:1: ')'
# expected near 'off'`. All three call sites below were this dead
# syntax, including `after_sleep_cmd` — meaning a real suspend/resume
# could have come back to a screen that never got DPMS'd back on.
# Correct form: hl.dsp.dpms({ action = "on" | "off" | "toggle" }) — a TABLE.
#
# 🐛 2026-09-21: the bare-string form `hl.dsp.dpms("on")` that stood here
# (and was "confirmed live both directions") is NOT "on": with no valid
# `action` table it falls back to TOGGLE. It only looked right when each
# check started from the opposite state. Run when the screen was ALREADY on
# (the normal case after a resume) it turns the display OFF — verified:
#   dpmsStatus true --dpms("on")--> false ; dpms({action="on"}) --> true,
# and the table form is idempotent. Whether dpms is toggling is only
# visible by running the command from BOTH states.
# That toggle is the likely cause of "machine goes dark, needs a hard
# reboot" (see the disabled listener below). Never test this with "off"
# on the real display without a way back: `hyprctl dispatch
# 'hl.dsp.dpms({ action = "on" })'` restores it.
general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
    ignore_dbus_inhibit = false
}

# 2.5 min — dim the backlight, remember the level so it can be restored.
# on-resume ramps back up over ~300ms (scripts/brightness-ramp.sh) instead
# of snapping to full brightness instantly — the "anti-flashbang" behaviour
# researched 2026-09-22 (end-4/dots-hyprland, Noctalia both do this). Own
# save file, not `brightnessctl -s`/`-r`: see the script's header comment
# for why.
listener {
    timeout = 150
    on-timeout = sh -c 'brightnessctl g > ~/.cache/pre-dim-brightness; brightnessctl set 10'
    on-resume = ~/.config/hypr/scripts/brightness-ramp.sh
}

# 5 min — lock
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# 6 min — screen off — DISABLED (2026-09-18). User reports the machine
# going dark while just idle (lid open, no suspend involved) and needing
# a hard reboot to recover — same symptom class as the s2idle amdgpu bug
# below, but triggered by DPMS off/on cycling the eDP-1 connector instead
# of suspend/resume. This AMD Rembrandt 680M (DCN 3.1.2) panel reports
# PSR (panel self-refresh) support — DPMS off/on toggling a PSR-capable
# connector is a known rough edge on this generation. Correcting the
# earlier assumption below: DPMS is NOT confirmed safe. Locking still
# works and doesn't touch DRM connector state, so it stays. If this needs
# re-enabling to test, watch `journalctl -k -f` for amdgpu/drm/vblank
# warnings around the moment it goes dark.
# listener {
#     timeout = 360
#     on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
#     on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
# }

# Auto-suspend deliberately removed (2026-09-18). This APU (AMD Rembrandt
# 680M) hits an upstream amdgpu bug on resume from s2idle: kernel WARNING
# at amdgpu_dm_atomic_commit_tail (drm_crtc_vblank_get(...) != 0), display
# never comes back, machine needs a hard reboot. Confirmed via journalctl
# -b -1 -k: suspend at 13:55, resume attempt at 14:32 threw the warning,
# clean poweroff 10s later — the user had to force-restart. Locking above
# is unaffected; DPMS screen-off above is now also disabled (see note on
# that listener) — only dim and lock remain active.
# Same root cause applies to lid-close (logind HandleLidSwitch=suspend by
# default) — see NOTES for that decision.
