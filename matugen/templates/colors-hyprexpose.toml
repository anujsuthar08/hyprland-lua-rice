[appearance]
font = "Adwaita Sans 11"
label_font = "Adwaita Sans Bold 13"
card_padding = 24.0
card_radius = 12.0
max_card_width  = 480.0
max_card_height = 320.0
label_height = 32.0
thumb_padding = 8.0
select_border = 3.0

[colors]
# Scrim stays neutral black, same reasoning as the shell's own dropdown
# scrims (BarDropdown/ControlCenter/Cheatsheet): it exists to hold focus
# on the cards, not to carry the palette.
background = "#000000bf"

card       = "#{{colors.surface_container.default.hex_stripped}}f2"
selection  = "#{{colors.primary.default.hex_stripped}}e6"
label      = "#{{colors.on_surface.default.hex_stripped}}ff"
empty_label   = "#{{colors.on_surface_variant.default.hex_stripped}}94"
window_label  = "#{{colors.on_surface.default.hex_stripped}}e6"
# Distinct from the primary selection border, same as the bar's
# secondary/tertiary accents elsewhere in this shell.
active_window = "#{{colors.tertiary.default.hex_stripped}}f2"

[behavior]
no_preview = false
switch_on_move = true
allow_mouse = false
