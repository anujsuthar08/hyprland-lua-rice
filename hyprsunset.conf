# hyprsunset — NOTE: like hyprlock/hypridle this is a SEPARATE app and still
# uses hyprlang; only Hyprland itself moved to Lua. Do not convert it.
#
# Deliberately NO schedule here. hyprsunset's own time profiles drop the
# night profile if the daemon (re)starts after the profile's time, until the
# next trigger (omacom/omarchy #12334). The shell owns the schedule instead
# (ags/widget/bar/nightState.ts) and re-asserts the wanted state every minute;
# this file only sets the resting state: no colour change.
profile {
    time = 00:00
    identity = true
}
